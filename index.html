<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="Your six-month Sleeper Build workout, strength and protein tracker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>Sleeper Build 6-Month Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#0f172a',
              900: '#0b1120',
              950: '#050811',
            },
            accent: {
              blue: '#3b82f6',
              cyan: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    input { -webkit-user-select: text; user-select: text; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-blue {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
    }
    .glow-emerald {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="min-h-screen pb-24 md:pb-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- INITIAL DATA STRUCTURES ---
    const TARGET_LIFTS = [
      { id: 'bench', name: 'Bench Press', start: 40, target: 80, unit: 'kg' },
      { id: 'squat', name: 'Barbell Squat', start: 50, target: 100, unit: 'kg' },
      { id: 'deadlift', name: 'Conventional Deadlift', start: 60, target: 130, unit: 'kg' },
      { id: 'pullup', name: 'Weighted Pull-Ups', start: 0, target: 15, unit: 'kg added' },
    ];

    const WORKOUT_PROGRAMS = {
      phase1: {
        title: "Phase 1: Neural Foundation (Months 1–3)",
        workouts: {
          A: {
            name: "Workout A: Push & Quads",
            exercises: [
              { name: "Barbell Back Squat", sets: 3, reps: "5", defaultWeight: 50, rest: 180 },
              { name: "Flat Barbell Bench Press", sets: 3, reps: "5", defaultWeight: 40, rest: 180 },
              { name: "Standing Overhead Press", sets: 3, reps: "5", defaultWeight: 30, rest: 120 },
              { name: "Dips (Bodyweight or Machine)", sets: 3, reps: "6-8", defaultWeight: 0, rest: 90 },
              { name: "Ab Wheel / Leg Raises", sets: 3, reps: "10-12", defaultWeight: 0, rest: 60 }
            ]
          },
          B: {
            name: "Workout B: Pull & Posterior",
            exercises: [
              { name: "Conventional Deadlift", sets: 3, reps: "5", defaultWeight: 60, rest: 180 },
              { name: "Lat Pulldown / Pull-Ups", sets: 4, reps: "6-8", defaultWeight: 0, rest: 120 },
              { name: "Bent-Over Barbell Rows", sets: 3, reps: "6", defaultWeight: 35, rest: 120 },
              { name: "Cable Face Pulls", sets: 3, reps: "12-15", defaultWeight: 15, rest: 60 },
              { name: "Plank Hold", sets: 3, reps: "45-60s", defaultWeight: 0, rest: 60 }
            ]
          }
        }
      },
      phase2: {
        title: "Phase 2: Sleeper Build (Months 4–6)",
        workouts: {
          A: {
            name: "Workout A: High Tension Push",
            exercises: [
              { name: "Barbell Back Squat", sets: 4, reps: "4-6", defaultWeight: 75, rest: 180 },
              { name: "Flat Barbell Bench Press", sets: 4, reps: "4-6", defaultWeight: 65, rest: 180 },
              { name: "Incline Dumbbell Press", sets: 3, reps: "8", defaultWeight: 24, rest: 120 },
              { name: "Standing Overhead Press", sets: 3, reps: "5", defaultWeight: 42.5, rest: 120 },
              { name: "Dumbbell Lateral Raises", sets: 3, reps: "12-15", defaultWeight: 10, rest: 60 },
              { name: "Hanging Leg Raises", sets: 3, reps: "10-12", defaultWeight: 0, rest: 60 }
            ]
          },
          B: {
            name: "Workout B: Power & Lat Width",
            exercises: [
              { name: "Conventional Deadlift", sets: 3, reps: "3-5", defaultWeight: 100, rest: 210 },
              { name: "Weighted Pull-Ups", sets: 4, reps: "5", defaultWeight: 5, rest: 150 },
              { name: "Heavy Single-Arm DB Rows", sets: 3, reps: "6-8", defaultWeight: 30, rest: 90 },
              { name: "Cable Face Pulls", sets: 3, reps: "15", defaultWeight: 20, rest: 60 },
              { name: "Farmers Walk (Carries)", sets: 3, reps: "30 meters", defaultWeight: 28, rest: 90 }
            ]
          }
        }
      }
    };

    const FORM_GUIDES = [
      {
        id: 'bench',
        name: 'Bench Press',
        cues: [
          'Eyes directly under the bar before unwrapping.',
          'Pinch shoulder blades together like holding a pen between them.',
          'Feet flat on floor; push legs down to create a tight arch.',
          'Lower bar with control to mid-chest (nipple line).',
          'Elbows tucked at 45° angle, not flared out wide.'
        ]
      },
      {
        id: 'squat',
        name: 'Barbell Squat',
        cues: [
          'Set rack height at chest-level (never reach on toes).',
          'Rest bar securely on upper back traps, not your neck bone.',
          'Feet shoulder-width apart, toes pointed out ~15 degrees.',
          'Take deep breath into gut, break at hips and knees together.',
          'Squat to parallel; drive mid-foot back up smoothly.'
        ]
      },
      {
        id: 'deadlift',
        name: 'Conventional Deadlift',
        cues: [
          'Bar over mid-foot (approx 1 inch away from shins).',
          'Feet hip-width apart; grip bar outside your legs.',
          'Pull chest tall to flatten spine and activate lats (slack out of bar).',
          'Push floor away with legs—do not yank with arms/lower back.',
          'Keep bar dragging close against shins and thighs.'
        ]
      },
      {
        id: 'ohp',
        name: 'Standing Overhead Press',
        cues: [
          'Bar rests across collarbones/delts in open palms.',
          'Squeeze glutes tight and lock core to prevent lower back arch.',
          'Press straight up; pull chin back slightly to clear face.',
          'As bar passes forehead, push head forward to lock out over shoulders.'
        ]
      },
      {
        id: 'pullup',
        name: 'Weighted Pull-Ups',
        cues: [
          'Grip shoulder-width apart or slightly wider.',
          'Depress shoulder blades down first before pulling arms.',
          'Pull chest up to bar, driving elbows down toward your hips.',
          'Lower completely under 2-second control to full arm hang.'
        ]
      }
    ];

    // --- SMALL UTILITIES ---
    const dayKey = (d = new Date()) =>
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    const roundTo = (x, step) => Math.round(x / step) * step;

    // --- PHOTO STORAGE (IndexedDB, on-device only) ---
    const openPhotoDB = () => new Promise((resolve, reject) => {
      const req = indexedDB.open('sleeper_photos_db', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    const dbGetAllPhotos = async () => {
      const db = await openPhotoDB();
      return new Promise((resolve, reject) => {
        const r = db.transaction('photos', 'readonly').objectStore('photos').getAll();
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    };
    const dbPutPhoto = async (photo) => {
      const db = await openPhotoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').put(photo);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };
    const dbDeletePhoto = async (id) => {
      const db = await openPhotoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };
    // Shrink to max 1000px and JPEG-compress so photos stay small
    const compressImage = (file) => new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image could not be read')); };
      img.src = url;
    });

    // --- WARM-UP SETS (big barbell lifts only, assumes a 20kg bar) ---
    const makeWarmups = (name, workingWeight) => {
      if (!/squat|bench press|deadlift|overhead press/i.test(name)) return [];
      const W = Number(workingWeight) || 0;
      if (W <= 20) return [];
      const list = [{ weight: 20, reps: 8 }];
      [[0.5, 5], [0.7, 3], [0.85, 1]].forEach(([pct, reps]) => {
        const w = roundTo(W * pct, 2.5);
        if (w > 20 && w < W && !list.some(x => x.weight === w)) list.push({ weight: w, reps });
      });
      return list;
    };

    // --- PROGRESSION HELPERS ---
    // Double progression: hit the TOP of the rep range on every set with 2+ reps in reserve, then add weight.
    const parseRepRange = (str) => {
      const nums = String(str).match(/\d+(\.\d+)?/g) || ['5'];
      return { min: Number(nums[0]), max: Number(nums[nums.length - 1]) };
    };

    const getIncrement = (name) => {
      if (/overhead/i.test(name)) return 1.25;
      if (/lateral/i.test(name)) return 1;
      if (/dumbbell|db |farmer/i.test(name)) return 2;
      return 2.5;
    };

    // logs are stored newest-first; deload sessions are ignored so you resume from your real working weights
    const getBaseSuggestion = (logs, ex) => {
      let prev = null;
      for (const log of logs) {
        if (log.deload) continue;
        const found = (log.exercises || []).find(e => e.name === ex.name && e.sets.some(s => s.completed));
        if (found) { prev = found; break; }
      }
      if (!prev) return { weight: ex.defaultWeight, last: ex.defaultWeight, note: 'First time: starting weight' };

      const done = prev.sets.filter(s => s.completed);
      const topWeight = Math.max(...done.map(s => Number(s.weight)));
      const repsText = done.map(s => s.reps).join(', ');
      const range = parseRepRange(ex.reps);

      if (topWeight === 0 && ex.defaultWeight === 0) {
        return { weight: 0, last: 0, note: `Last: ${repsText} reps. Try to beat one set by a rep.` };
      }

      const atTop = done.filter(s => Number(s.weight) === topWeight);
      const lastText = `Last: ${topWeight}kg × ${repsText}`;
      const allSetsDone = atTop.length >= ex.sets;
      const allTopReps = atTop.every(s => Number(s.reps) >= range.max);
      const allEasyEnough = atTop.every(s => Number(s.rir) >= 2);
      const anyBelowMin = atTop.some(s => Number(s.reps) < range.min);

      if (allSetsDone && allTopReps && allEasyEnough) {
        const inc = getIncrement(ex.name);
        return { weight: Math.round((topWeight + inc) * 100) / 100, last: topWeight, note: `${lastText}. Every set hit the top of the range: +${inc}kg today.` };
      }
      if (anyBelowMin) {
        return { weight: topWeight, last: topWeight, note: `${lastText}. Hold this weight and aim for ${range.min}+ reps on every set.` };
      }
      return { weight: topWeight, last: topWeight, note: `${lastText}. Same weight: aim for ${range.max} reps on every set with 2+ RIR.` };
    };

    const getSuggestion = (logs, ex, deload = false) => {
      const base = getBaseSuggestion(logs, ex);
      if (!deload) return base;
      const w = base.last > 0 ? roundTo(base.last * 0.9, 2.5) : 0;
      return { weight: w, note: w > 0 ? `Deload: about 90% of ${base.last}kg. Stop every set with 3+ reps left.` : 'Deload: easy sets, stop with 3+ reps left.' };
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      // Local Storage State
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, logger, protein, guide, stats
      const [currentPhase, setCurrentPhase] = useState('phase1'); // phase1 or phase2
      const [selectedWorkout, setSelectedWorkout] = useState('A'); // A or B
      const [currentWeek, setCurrentWeek] = useState(1);
      const [proteinEntries, setProteinEntries] = useState([]); // today's individual entries
      const [proteinHistory, setProteinHistory] = useState({}); // { 'YYYY-MM-DD': grams }
      const [customProtein, setCustomProtein] = useState('');
      const proteinIntake = proteinEntries.reduce((a, b) => a + b, 0);
      const [checkIns, setCheckIns] = useState([]); // newest first
      const [ciForm, setCiForm] = useState({ weight: '', waist: '', chest: '', arm: '', thigh: '' });
      const proteinGoal = checkIns[0] ? Math.round((checkIns[0].weight * 1.8) / 5) * 5 : 150; // ~1.8g per kg
      const [deloadChoice, setDeloadChoice] = useState({}); // { weekNumber: true/false }
      const [photos, setPhotos] = useState([]);
      const [photoLabel, setPhotoLabel] = useState('Front');
      const [photosShown, setPhotosShown] = useState(false);
      const [viewPhoto, setViewPhoto] = useState(null);
      const [workoutLogs, setWorkoutLogs] = useState([]);
      const [maxLifts, setMaxLifts] = useState({
        bench: 40,
        squat: 50,
        deadlift: 60,
        pullup: 0
      });

      // Active Workout Session State
      const [isWorkingOut, setIsWorkingOut] = useState(false);
      const [activeSessionData, setActiveSessionData] = useState([]);
      
      // Timer State
      const [timerTime, setTimerTime] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const timerRef = useRef(null);

      // --- DELOAD LOGIC ---
      const isScheduledDeload = currentWeek % 6 === 0;
      const deloadActive = deloadChoice[currentWeek] !== undefined ? deloadChoice[currentWeek] : isScheduledDeload;
      const toggleDeload = () => setDeloadChoice({ ...deloadChoice, [currentWeek]: !deloadActive });
      const recentLogs = workoutLogs.filter(l => !l.deload).slice(0, 2);
      const recentSets = recentLogs.flatMap(l => l.exercises.flatMap(e => e.sets.filter(st => st.completed)));
      const needsDeload = !deloadActive && recentLogs.length >= 2 && recentSets.length >= 8 &&
        recentSets.filter(st => Number(st.rir) === 0).length / recentSets.length >= 0.5;

      // Load Data from LocalStorage on mount
      useEffect(() => {
        const savedLogs = localStorage.getItem('sleeper_workout_logs');
        if (savedLogs) setWorkoutLogs(JSON.parse(savedLogs));

        const todayStr = new Date().toDateString();
        let hist = {};
        let entries = [];
        try { hist = JSON.parse(localStorage.getItem('sleeper_protein_history') || '{}'); } catch (e) {}
        try { entries = JSON.parse(localStorage.getItem('sleeper_protein_entries') || '[]'); } catch (e) {}
        const savedProtein = Number(localStorage.getItem('sleeper_protein_today') || 0);
        const savedProteinDate = localStorage.getItem('sleeper_protein_date');

        if (savedProteinDate === todayStr) {
          if (entries.length === 0 && savedProtein > 0) entries = [savedProtein]; // carried over from an older version
          setProteinEntries(entries);
        } else {
          // new day: bank the last day's total into history, start fresh
          const prevTotal = entries.length ? entries.reduce((a, b) => a + b, 0) : savedProtein;
          if (savedProteinDate && prevTotal > 0) {
            const d = new Date(savedProteinDate);
            if (!isNaN(d.getTime())) hist[dayKey(d)] = prevTotal;
          }
          setProteinEntries([]);
        }
        setProteinHistory(hist);

        try {
          const savedDeload = localStorage.getItem('sleeper_deload_choice');
          if (savedDeload) setDeloadChoice(JSON.parse(savedDeload));
        } catch (e) {}

        dbGetAllPhotos()
          .then(list => setPhotos(list.sort((x, y) => y.id - x.id)))
          .catch(() => {});

        const savedMaxes = localStorage.getItem('sleeper_max_lifts');
        if (savedMaxes) setMaxLifts(JSON.parse(savedMaxes));

        const savedWeek = localStorage.getItem('sleeper_current_week');
        if (savedWeek) setCurrentWeek(Number(savedWeek));

        try {
          const savedCI = localStorage.getItem('sleeper_checkins');
          if (savedCI) setCheckIns(JSON.parse(savedCI));
        } catch (e) {}
      }, []);

      // Save Data Effects
      useEffect(() => {
        localStorage.setItem('sleeper_workout_logs', JSON.stringify(workoutLogs));
      }, [workoutLogs]);

      useEffect(() => {
        localStorage.setItem('sleeper_protein_today', proteinIntake.toString());
        localStorage.setItem('sleeper_protein_entries', JSON.stringify(proteinEntries));
        localStorage.setItem('sleeper_protein_date', new Date().toDateString());
      }, [proteinEntries]);

      useEffect(() => {
        localStorage.setItem('sleeper_protein_history', JSON.stringify(proteinHistory));
      }, [proteinHistory]);

      useEffect(() => {
        localStorage.setItem('sleeper_deload_choice', JSON.stringify(deloadChoice));
      }, [deloadChoice]);

      useEffect(() => {
        localStorage.setItem('sleeper_max_lifts', JSON.stringify(maxLifts));
      }, [maxLifts]);

      useEffect(() => {
        localStorage.setItem('sleeper_checkins', JSON.stringify(checkIns));
      }, [checkIns]);

      useEffect(() => {
        localStorage.setItem('sleeper_current_week', currentWeek.toString());
        if (currentWeek > 12) setCurrentPhase('phase2');
        else setCurrentPhase('phase1');
      }, [currentWeek]);

      // Timer Effect
      useEffect(() => {
        if (isTimerRunning && timerTime > 0) {
          timerRef.current = setInterval(() => {
            setTimerTime(prev => prev - 1);
          }, 1000);
        } else if (timerTime === 0) {
          setIsTimerRunning(false);
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isTimerRunning, timerTime]);

      const startRestTimer = (seconds) => {
        setTimerTime(seconds);
        setIsTimerRunning(true);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // Start Workout Session
      const handleStartWorkout = () => {
        const program = WORKOUT_PROGRAMS[currentPhase].workouts[selectedWorkout];
        const initialData = program.exercises.map(ex => {
          const sug = getSuggestion(workoutLogs, ex, deloadActive);
          const setCount = deloadActive ? Math.max(2, Math.ceil(ex.sets / 2)) : ex.sets;
          return {
            name: ex.name,
            note: sug.note,
            warmupDone: {},
            sets: Array.from({ length: setCount }, (_, i) => ({
              setNum: i + 1,
              weight: sug.weight,
              reps: parseInt(ex.reps) || 5,
              rir: deloadActive ? 3 : 2,
              completed: false
            }))
          };
        });
        setActiveSessionData(initialData);
        setIsWorkingOut(true);
      };

      // Update Set details in Active Session
      const handleUpdateSet = (exIdx, setIdx, field, value) => {
        const updated = [...activeSessionData];
        updated[exIdx].sets[setIdx][field] = value;
        setActiveSessionData(updated);
      };

      const toggleWarmup = (exIdx, wIdx) => {
        const updated = activeSessionData.map((ex, i) => i !== exIdx ? ex : {
          ...ex,
          warmupDone: { ...(ex.warmupDone || {}), [wIdx]: !(ex.warmupDone && ex.warmupDone[wIdx]) }
        });
        setActiveSessionData(updated);
      };

      const toggleSetComplete = (exIdx, setIdx, restSecs) => {
        const updated = [...activeSessionData];
        const isComp = !updated[exIdx].sets[setIdx].completed;
        updated[exIdx].sets[setIdx].completed = isComp;
        setActiveSessionData(updated);

        if (isComp) {
          startRestTimer(restSecs || 120);
        }
      };

      // Finish & Save Session
      const handleFinishWorkout = () => {
        let totalVol = 0;
        const newMaxes = { ...maxLifts };

        activeSessionData.forEach(ex => {
          ex.sets.forEach(s => {
            if (s.completed) {
              const setVol = Number(s.weight) * Number(s.reps);
              totalVol += setVol;

              // Check max lifts updates (Rough 1RM calculation: weight * (1 + reps/30))
              const est1RM = Math.round(Number(s.weight) * (1 + Number(s.reps) / 30));
              
              if (ex.name.includes("Bench") && est1RM > newMaxes.bench) newMaxes.bench = est1RM;
              if (ex.name.includes("Squat") && est1RM > newMaxes.squat) newMaxes.squat = est1RM;
              if (ex.name.includes("Deadlift") && est1RM > newMaxes.deadlift) newMaxes.deadlift = est1RM;
              if (ex.name.includes("Pull-Ups") && s.weight > newMaxes.pullup) newMaxes.pullup = Number(s.weight);
            }
          });
        });

        const newLogEntry = {
          id: Date.now(),
          date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
          phase: currentPhase === 'phase1' ? 'Phase 1' : 'Phase 2',
          workout: selectedWorkout,
          name: WORKOUT_PROGRAMS[currentPhase].workouts[selectedWorkout].name,
          exercises: activeSessionData,
          deload: deloadActive,
          totalVolume: totalVol
        };

        setWorkoutLogs([newLogEntry, ...workoutLogs]);
        setMaxLifts(newMaxes);
        setIsWorkingOut(false);
        setActiveTab('dashboard');
      };

      // Add Quick Protein
      const addProtein = (grams) => {
        const g = Math.round(Number(grams));
        if (!g || g < 1 || g > 200) return;
        setProteinEntries(prev => [...prev, g]);
      };
      const undoProtein = () => setProteinEntries(prev => prev.slice(0, -1));
      const addCustomProtein = () => {
        addProtein(customProtein);
        setCustomProtein('');
      };

      // --- PROGRESS PHOTOS ---
      const handlePhotoPick = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        try {
          const data = await compressImage(file);
          const photo = { id: Date.now(), iso: new Date().toISOString(), label: photoLabel, data };
          await dbPutPhoto(photo);
          setPhotos(prev => [photo, ...prev]);
          setPhotosShown(true);
          if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
        } catch (err) {
          alert('Could not save that photo: ' + (err && err.message ? err.message : err));
        }
      };

      const handleDeletePhoto = async (id) => {
        if (!confirm("Delete this photo? It can't be recovered.")) return;
        try {
          await dbDeletePhoto(id);
          setPhotos(prev => prev.filter(ph => ph.id !== id));
          setViewPhoto(null);
        } catch (err) {

        let csvContent = "data:text/csv;charset=utf-8,Date,Phase,Workout,Exercise,Set,Weight (kg),Reps,RIR,Volume (kg)\n";
        workoutLogs.forEach(log => {
          log.exercises.forEach(ex => {
            ex.sets.forEach(s => {
              if (s.completed) {
                const vol = s.weight * s.reps;
                csvContent += `"${log.date}","${log.phase}","${log.workout}","${ex.name}",${s.setNum},${s.weight},${s.reps},${s.rir},${vol}\n`;
              }
            });
          });
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Sleeper_Build_Logs_${new Date().toISOString().slice(0,10)}.csv`);

        const num = (v) => { const n = parseFloat(v); return n > 0 ? n : null; };
        const entry = {
          id: Date.now(),
          iso: new Date().toISOString(),
          weight: Math.round(w * 10) / 10,
          waist: num(ciForm.waist),
          chest: num(ciForm.chest),

      const getTrend = () => {
        if (checkIns.length < 2) return null;
        const newest = checkIns[0];
        const newestT = new Date(newest.iso).getTime();
        const inWindow = checkIns.filter(c => new Date(c.iso).getTime() >= newestT - 28 * DAY);
        const oldest = inWindow.length >= 2 ? inWindow[inWindow.length - 1] : checkIns[1];
        const days = (newestT - new Date(oldest.iso).getTime()) / DAY;
        if (days < 6) return null;
        const perWeek = (newest.weight - oldest.weight) / (days / 7);
        let tone, title, advice;
        if (perWeek < -0.15) {
          tone = 'amber'; title = 'Weight is dropping';
          advice = 'If the goal is muscle, add a little food: a snack or roughly 150-200 kcal a day.';
        } else if (perWeek <= 0.1) {
          tone = 'blue'; title = 'Holding steady';
          advice = 'Great for staying lean. If your lifts have stalled for 2+ weeks, add roughly 150 kcal a day.';

          tone = 'amber'; title = 'Gaining quickly';

        return { perWeek, tone, title, advice, days: Math.round(days) };

            <div className="space-y-6">
              <div className="glass-card p-6 rounded-2xl text-center space-y-4">
                <h2 className="text-xl font-bold text-white">Daily Protein Goal ({proteinGoal}g)</h2>
                <p className="text-xs text-slate-400 max-w-md mx-auto">
                  To build dense muscle without getting bulky, aim for ~1.8g protein per kg of body weight{latestCheckIn ? ` (${latestCheckIn.weight.toFixed(1)}kg gives ${proteinGoal}g).` : '. Log a weekly check-in and this goal personalises itself.'}
                </p>

                {/* CIRCULAR PROGRESS DISPLAY */}
                <div className="relative w-44 h-44 mx-auto flex items-center justify-center">
                  <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="42" stroke="currentColor" strokeWidth="8" className="text-slate-800" fill="transparent" />
                    <circle 
                      cx="50" 
                      cy="50" 
                      r="42" 
                      stroke="currentColor" 
                      strokeWidth="8" 
                      className="text-emerald-500 transition-all duration-500" 
                      fill="transparent"
                      strokeDasharray={264}
                      strokeDashoffset={264 - (264 * Math.min(100, (proteinIntake / proteinGoal) * 100)) / 100}
                      strokeLinecap="round"
                    />
                  </svg>
                  <div className="absolute text-center">
                    <span className="text-4xl font-black text-white font-mono">{proteinIntake}</span>
                    <span className="text-xs text-slate-400 block font-semibold">/ {proteinGoal}g Protein</span>
                  </div>
                </div>

                <div className="flex justify-center gap-2">
                  <button 
                    onClick={() => setProteinEntries([])}
                    className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-400 rounded"
                  >
                    Reset Today
                  </button>
                  <button
                    onClick={undoProtein}
                    disabled={proteinEntries.length === 0}
                    className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded disabled:opacity-40"
                  >
                    {proteinEntries.length > 0 ? `Undo last (+${proteinEntries[proteinEntries.length - 1]}g)` : 'Undo last'}
                  </button>
                </div>
              </div>

              {/* QUICK ADD BUTTONS */}
              <div className="glass-card p-5 rounded-2xl space-y-3">
                <h3 className="text-sm font-bold text-white uppercase tracking-wider">Quick Add Protein</h3>
                <div className="flex gap-2">
                  <input
                    type="number"
                    inputMode="numeric"
                    placeholder="Custom grams"
                    value={customProtein}
                    onChange={(e) => setCustomProtein(e.target.value)}
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500"
                  />
                  <button
                    onClick={addCustomProtein}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg"
                  >
                    Add
                  </button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                  {[
                    { label: '+25g Whey Shake', amount: 25, icon: '🥛' },
                    { label: '+40g Chicken / Steak', amount: 40, icon: '🥩' },
                    { label: '+30g Eggs & Toast', amount: 30, icon: '🍳' },
                    { label: '+50g Bolognese / Ragu', amount: 50, icon: '🍝' },
                  ].map((item, i) => (
                    <button
                      key={i}
                      onClick={() => addProtein(item.amount)}
                      className="p-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded-xl text-left transition-all group"
                    >
                      <span className="text-2xl block mb-1">{item.icon}</span>
                      <span className="text-xs font-bold text-slate-200 block group-hover:text-blue-400">{item.label}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* LAST 7 DAYS */}
              {(() => {
                const days = [];
                for (let i = 6; i >= 0; i--) {
                  const d = new Date();
                  d.setDate(d.getDate() - i);
                  days.push({
                    label: d.toLocaleDateString('en-GB', { weekday: 'short' }).slice(0, 2),
                    g: i === 0 ? proteinIntake : (proteinHistory[dayKey(d)] || 0),
                    today: i === 0
                  });
                }
                const top = Math.max(proteinGoal, ...days.map(x => x.g)) * 1.1;
                const logged = days.filter(x => x.g > 0);
                const avg = logged.length ? Math.round(logged.reduce((a, x) => a + x.g, 0) / logged.length) : 0;
                return (
                  <div className="glass-card p-5 rounded-2xl space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider">Last 7 Days</h3>
                      <span className="text-xs text-slate-400">{logged.length > 0 ? `Average ${avg}g on logged days` : 'Nothing logged yet'}</span>
                    </div>
                    <div className="relative h-28">
                      <div
                        className="absolute left-0 right-0 border-t border-dashed border-emerald-500/60"
                        style={{ bottom: `${(proteinGoal / top) * 100}%` }}
                      ></div>
                      <div className="absolute inset-0 flex items-end gap-2">
                        {days.map((d, i) => (
                          <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
                            <div
                              className={`w-full rounded-t ${d.today ? 'bg-blue-500' : d.g >= proteinGoal * 0.9 ? 'bg-emerald-500' : 'bg-slate-600'}`}
                              style={{ height: `${(d.g / top) * 100}%` }}
                            ></div>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="flex gap-2">
                      {days.map((d, i) => (
                        <div key={i} className="flex-1 text-center">
                          <p className="text-xs text-slate-400">{d.label}</p>
                          <p className="text-xs text-slate-500 font-mono">{d.g || '-'}</p>
                        </div>
                      ))}
                    </div>
                    <p className="text-xs text-slate-500">Dashed line is your goal. Green days reached at least 90% of it.</p>
                  </div>
                );
              })()}

              {/* MEAL CHEAT SHEET */}
              <div className="glass-card p-5 rounded-2xl space-y-3">
                <h3 className="text-sm font-bold text-white">140g Protein Cheat Sheet for 80kg Lifters</h3>
                <div className="space-y-2 text-xs text-slate-300">
                  <div className="flex justify-between p-2 bg-slate-900/60 rounded border border-slate-800">
                    <span>3-4 Eggs on Wholemeal Toast</span>
                    <strong className="text-emerald-400 font-mono">~25g protein</strong>
                  </div>
                  <div className="flex justify-between p-2 bg-slate-900/60 rounded border border-slate-800">
                    <span>200g Chicken Breast / Beef Steak</span>
                    <strong className="text-emerald-400 font-mono">~45g protein</strong>
                  </div>
                  <div className="flex justify-between p-2 bg-slate-900/60 rounded border border-slate-800">
                    <span>200g 5% Beef Mince Portion</span>
                    <strong className="text-emerald-400 font-mono">~42g protein</strong>
                  </div>
                  <div className="flex justify-between p-2 bg-slate-900/60 rounded border border-slate-800">
                    <span>1 Scoop Whey Protein Powder</span>
                    <strong className="text-emerald-400 font-mono">~25g protein</strong>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB: WEEKLY CHECK-IN */}
          {activeTab === 'progress' && (
            <div className="space-y-6">
              <div className="glass-card p-5 rounded-2xl space-y-4">
                <div>
                  <h2 className="text-lg font-bold text-white">Weekly Check-In</h2>
                  <p className="text-xs text-slate-400 mt-1">
                    Once a week, same day, same time (morning, before food). A single number is noise; the trend is what counts. Measurements are optional.
                  </p>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  {[
                    ['weight', 'Weight (kg) *', '80.0'],
                    ['waist', 'Waist (cm)', ''],
                    ['chest', 'Chest (cm)', ''],
                    ['arm', 'Upper arm (cm)', ''],
                    ['thigh', 'Thigh (cm)', '']
                  ].map(([key, label, ph]) => (
                    <label key={key} className="block">
                      <span className="text-xs text-slate-400 font-semibold">{label}</span>
                      <input
                        type="number"
                        inputMode="decimal"
                        step="0.1"
                        value={ciForm[key]}
                        placeholder={ph}
                        onChange={(e) => setCiForm({ ...ciForm, [key]: e.target.value })}
                        className="mt-1 w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500"
                      />
                    </label>
                  ))}
                </div>
                <button
                  onClick={addCheckIn}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl shadow-lg glow-blue transition-all"
                >
                  Save Check-In
                </button>
              </div>

              {/* TREND */}
              <div className="glass-card p-5 rounded-2xl space-y-3">
                <h3 className="text-base font-bold text-white">Your Trend</h3>
                {trend ? (
                  <div className={`p-3 rounded-xl border ${
                    trend.tone === 'emerald' ? 'border-emerald-500/30 bg-emerald-500/10' :
                    trend.tone === 'amber' ? 'border-amber-500/30 bg-amber-500/10' :
                    'border-blue-500/30 bg-blue-500/10'
                  }`}>
                    <p className="text-sm font-bold text-white">
                      {trend.title}: {trend.perWeek > 0 ? '+' : ''}{trend.perWeek.toFixed(2)} kg/week
                    </p>
                    <p className="text-xs text-slate-300 mt-1">{trend.advice}</p>
                    <p className="text-xs text-slate-500 mt-1">Based on the last {trend.days} days. Lean-gain target: about +0.1 to +0.35 kg/week.</p>
                  </div>
                ) : (
                  <p className="text-xs text-slate-400">Your trend appears once you have two check-ins at least a week apart.</p>
                )}

                {checkIns.length >= 2 && (() => {
                  const pts = checkIns.slice(0, 12).slice().reverse();
                  const ws = pts.map(c => c.weight);
                  const lo = Math.min(...ws) - 0.5;
                  const hi = Math.max(...ws) + 0.5;
                  const coords = pts.map((c, i) => {
                    const x = 10 + (i / (pts.length - 1)) * 280;
                    const y = 70 - ((c.weight - lo) / (hi - lo)) * 60;
                    return `${x.toFixed(1)},${y.toFixed(1)}`;
                  }).join(' ');
                  return (
                    <svg viewBox="0 0 300 80" className="w-full h-20">
                      <polyline points={coords} fill="none" stroke="#3b82f6" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                      {coords.split(' ').map((pt, i) => {
                        const [cx, cy] = pt.split(',');
                        return <circle key={i} cx={cx} cy={cy} r="3" fill="#10b981" />;
                      })}
                    </svg>
                  );
                })()}

                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                  {[['waist', 'Waist'], ['chest', 'Chest'], ['arm', 'Arm'], ['thigh', 'Thigh']].map(([key, label]) => {
                    const d = getMeasureDelta(key);
                    return (
                      <div key={key} className="bg-slate-900 border border-slate-800 rounded-lg p-2 text-center">
                        <p className="text-xs text-slate-400">{label}</p>
                        <p className="text-sm font-bold text-white">{d === null ? '--' : `${d > 0 ? '+' : ''}${d} cm`}</p>
                      </div>
                    );
                  })}
                </div>
                <p className="text-xs text-slate-500">Change since your first measurement. Tape readings wobble by about 1 cm, so look for patterns over weeks.</p>
                {waistDelta !== null && waistDelta >= 2 && (
                  <p className="text-xs text-amber-400">Your waist is up 2 cm or more. That usually means gains are drifting towards fat, so hold calories where they are.</p>
                )}
              </div>

              {/* PROGRESS PHOTOS */}
              <div className="glass-card p-5 rounded-2xl space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Progress Photos</h3>
                  {photos.length > 0 && (
                    <button
                      onClick={() => setPhotosShown(!photosShown)}
                      className="text-xs px-2.5 py-1 bg-slate-800 border border-slate-700 rounded text-slate-300"
                    >
                      {photosShown ? 'Hide photos' : `Show photos (${photos.length})`}
                    </button>
                  )}
                </div>
                <p className="text-xs text-slate-400">
                  Saved only on this phone, never uploaded. Same spot, same light, same pose every 4 weeks works best. Clearing your browser or app data deletes them.
                </p>
                <div className="flex gap-2 items-center">
                  <select
                    value={photoLabel}
                    onChange={(e) => setPhotoLabel(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white"
                  >
                    <option>Front</option>
                    <option>Side</option>
                    <option>Back</option>
                  </select>
                  <label className="flex-1 text-center py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl cursor-pointer">
                    Add {photoLabel.toLowerCase()} photo
                    <input type="file" accept="image/*" className="hidden" onChange={handlePhotoPick} />
                  </label>
                </div>

                {photosShown && (() => {
                  const shown = photos.filter(ph => ph.label === photoLabel);
                  const fmt = (iso) => new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                  if (shown.length === 0) {
                    return <p className="text-xs text-slate-500">No {photoLabel.toLowerCase()} photos yet.</p>;
                  }
                  const first = shown[shown.length - 1];
                  const latest = shown[0];
                  return (
                    <div className="space-y-3">
                      {shown.length >= 2 && (
                        <div>
                          <p className="text-xs text-slate-400 font-semibold mb-1">First vs latest ({photoLabel.toLowerCase()})</p>
                          <div className="grid grid-cols-2 gap-2">
                            {[first, latest].map((ph, i) => (
                              <button key={ph.id} onClick={() => setViewPhoto(ph)} className="text-left">
                                <img src={ph.data} alt={`${photoLabel} ${i === 0 ? 'first' : 'latest'}`} className="w-full aspect-[3/4] object-cover rounded-lg" />
                                <span className="text-xs text-slate-500">{i === 0 ? 'First' : 'Latest'}: {fmt(ph.iso)}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                      <div className="grid grid-cols-3 gap-2">
                        {shown.map(ph => (
                          <button key={ph.id} onClick={() => setViewPhoto(ph)} className="text-left">
                            <img src={ph.data} alt={`${ph.label} ${fmt(ph.iso)}`} className="w-full aspect-[3/4] object-cover rounded-lg" />
                            <span className="text-xs text-slate-500">{fmt(ph.iso)}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </div>

              {/* HISTORY */}
              {checkIns.length > 0 && (
                <div className="glass-card p-5 rounded-2xl space-y-2">
                  <h3 className="text-base font-bold text-white">Check-In History</h3>
                  {checkIns.map(c => (
                    <div key={c.id} className="flex items-center justify-between text-xs bg-slate-900 border border-slate-800 rounded-lg px-3 py-2">
                      <div>
                        <span className="text-slate-400">{new Date(c.iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                        <span className="text-white font-bold ml-3">{c.weight.toFixed(1)} kg</span>
                        <span className="text-slate-500 ml-3">
                          {[c.waist && `W ${c.waist}`, c.chest && `C ${c.chest}`, c.arm && `A ${c.arm}`, c.thigh && `T ${c.thigh}`].filter(Boolean).join(' · ')}
                        </span>
                      </div>
                      <button onClick={() => deleteCheckIn(c.id)} className="text-slate-500 hover:text-red-400 px-2">✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* TAB 4: FORM CUES */}
          {activeTab === 'guide' && (
            <div className="space-y-4">
              <div className="glass-card p-4 rounded-xl">
                <h2 className="text-lg font-bold text-white">Form & Safety Pocket Guide</h2>
                <p className="text-xs text-slate-400">Quick cues to review before unracking heavy weights.</p>
              </div>

              {FORM_GUIDES.map(guide => (
                <div key={guide.id} className="glass-card p-5 rounded-xl space-y-2">
                  <h3 className="text-base font-bold text-blue-400 flex items-center gap-2">
                    <span>🏋️‍♂️</span> {guide.name}
                  </h3>
                  <ul className="space-y-1.5 text-xs text-slate-300">
                    {guide.cues.map((cue, idx) => (
                      <li key={idx} className="flex items-start gap-2">
                        <span className="text-blue-500 font-bold">•</span>
                        <span>{cue}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          )}

          {/* TAB 5: HISTORY & CSV EXPORT */}
          {activeTab === 'stats' && (
            <div className="space-y-6">
              <div className="glass-card p-5 rounded-2xl flex justify-between items-center">
                <div>
                  <h2 className="text-lg font-bold text-white">Workout History</h2>
                  <p className="text-xs text-slate-400">{workoutLogs.length} sessions logged</p>
                </div>
                <button
                  onClick={exportCSV}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow glow-blue transition-all"
                >
                  📥 Export CSV
                </button>
              </div>

              {/* LOG LIST */}
              {workoutLogs.length === 0 ? (
                <div className="glass-card p-8 rounded-2xl text-center text-slate-400 text-xs">
                  No completed workouts logged yet. Complete a session in the Workout Log tab to build your history!
                </div>
              ) : (
                <div className="space-y-3">
                  {workoutLogs.map((log) => (
                    <div key={log.id} className="glass-card p-4 rounded-xl space-y-2 border-l-4 border-blue-500">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-white text-sm">{log.name}{log.deload ? ' (deload)' : ''}</span>
                        <span className="text-slate-400">{log.date}</span>
                      </div>
                      <div className="flex gap-4 text-xs text-slate-400 font-mono">
                        <span>Phase: {log.phase}</span>
                        <span>Total Volume: <strong className="text-emerald-400">{log.totalVolume} kg</strong></span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <script>
    // Register the offline app shell. The service worker also caches the CDN
    // libraries used by the original tracker after the first online visit.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err =>
          console.warn('Offline support could not be registered:', err)
        );
      });
    }
  </script>
</body>
</html>
